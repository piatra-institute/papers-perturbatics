- id: def-perturbatics
  kind: definition
  passage: 'Perturbatics is the study of these signatures and batteries: which controlled differences
    separate the competing accounts of a system, at what cost, and where a battery leaves an equivalence
    it cannot break.'
  rationale: Stipulative definition of the field; everything else in the paper is organised around it.
- id: def-legibility
  kind: definition
  passage: is a legibility term.
  rationale: Defines L_i = phi^E_i - phi^C_i, the difference between the evidence and capacity attributions;
    the paper's one novel construction (Section 4).
- id: def-pure-channel
  kind: definition
  passage: Call a component a pure channel when its switch adds a fixed increment $\delta_\pi$ to the
    evidence in every coalition that contains it and never moves the system.
  rationale: Defines the component class for which the pure-channel proposition fixes L = delta-bar independently
    of the rest of the assemblage.
- id: prop-separation
  kind: interpretation
  passage: no classifier separates them above chance under equal priors, because no functional of a record
    distinguishes distributions that the record itself cannot distinguish.
  rationale: The separation principle, a restatement of observational non-identifiability; the paper states
    it as inherited, not novel.
- id: prop-finite-battery
  kind: interpretation
  passage: 'No finite battery certifies a capacity against an unrestricted class of rivals, so every output
    is relative to the declared class of hypotheses, and a complete report names that class: under boundary
    $B$ and battery $\Pi$, the record is so many times more probable under $H_i$ than under the strongest
    rival tested, and the listed rivals remain unseparated.'
  rationale: Follows from the existence of a finite-state transducer reproducing any finite signature
    table (Moore 1956; Block 1981); the paper draws the reporting rule from it.
- id: assume-illustrative
  kind: assumption
  passage: The model is illustrative, instantiates the definitions and is not fit to data.
  rationale: The gridworld, its organisms and switch baselines are hand-specified; no parameter is estimated
    from data.
- id: assume-oracle
  kind: assumption
  passage: This section and the next use an oracle scorer given the true current goal and the true obstacle
    set, so they confirm that the instrument returns what the construction puts into it; the persona's
    share in particular is a theorem returned to the decimal.
  rationale: States that Sections 5-6 test the definitions under known ground truth, not the instrument's
    inferential power; only Section 7 removes the oracle.
- id: assume-null
  kind: assumption
  passage: The null is one named rival, a descent toward the frozen target, set-point attraction without
    a goal register, the thermostat pole of the agency scale, so every score is the margin of goal-rewriting
    organization over set-point dynamics.
  rationale: All agency scores are relative to this single passive model; a richer null family is specified
    but not exercised.
- id: assume-well-specified
  kind: assumption
  passage: The hypothesis library contains the generating classes, so the study measures discrimination
    within a well-specified set and says nothing about robustness against an unlisted mechanism.
  rationale: Scope limit of the blind-recovery study.
- id: assume-credulity
  kind: assumption
  passage: The whole crossover rests on one stipulation, that the register is credulous and the operator
    is not, so credulity is treated as a parameter and the crossover is recomputed across it.
  rationale: The goal-authority comparison depends on this modelling choice; the credulity sweep is reported
    for that reason.
- id: interp-role-not-occupant
  kind: interpretation
  passage: It shows that this instrument's measurand attaches to a role and not to its occupant, and that
    a component with no channel to the world has a capacity share of zero whoever occupies it.
  rationale: Reading of the substrate-independence identity (checks.centaur_channel_legibility_substrate_gap
    = 0); explicitly not evidence about human supervisors.
- id: interp-not-human
  kind: interpretation
  passage: It is not evidence about actual human supervisors, who hold goals, revise them and answer for
    them in ways no component of this assemblage models.
  rationale: Scope limit on the centaur result.
- id: interp-observer-not-run
  kind: interpretation
  passage: That experiment has not been run.
  rationale: The observer-side quantity T_i is defined but not measured; no claim in the paper depends
    on its value.
- id: interp-consciousness
  kind: normative
  passage: 'There the instrument reports no number, and what remains is a practical stance: declining
    to treat as a mere object a system that might be a subject.'
  rationale: 'The paper''s fourth claim is a position, not a finding: the deciding probe for consciousness
    is uninformative, inadmissible and underdetermined, and the recommended stance follows from that conjunction.'
- id: norm-admissibility
  kind: normative
  passage: A battery owes its rivals negative controls and owes its subject reversibility, and both obligations
    belong to the same discipline.
  rationale: Normative constraint on probe design introduced with the admissibility term M(pi).
