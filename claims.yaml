claims:
- id: abs-rest-auroc
  kind: computation
  passage: In a gridworld, three systems trace one path at rest (every pairwise AUROC $0.50$), and a two-probe
    battery separates every pair although neither probe does alone.
  evidence:
    file: simulation/output/results.json
    run_id: agentoscope
    pointer: /separation/auroc_at_rest
    reported: '0.50'
    decimals: 2
    units: AUROC between systems at rest
    conditions: deterministic 13x13 gridworld, seed 0, 40 instances, beta 1.5, horizon 40; oracle scorer
- id: abs-sham-auroc
  kind: computation
  passage: A system tracking the last-announced target is invisible to that battery until a matched sham,
    a decoy where the goal did not move, separates it at $1.0$.
  evidence:
    file: simulation/output/results.json
    run_id: agentoscope
    pointer: /sham_control/auroc_reactive_vs_marker_tracker_by_probe/sham
    reported: '1.0'
    decimals: 1
    units: AUROC goal tracker vs marker tracker under the sham
    conditions: deterministic 13x13 gridworld, seed 0, 40 instances, beta 1.5, horizon 40; oracle scorer
- id: abs-persona-L
  kind: computation
  passage: Do-Shapley attribution of both the evidence for agency and the realized performance yields
    a legibility term, their difference, which takes the same value, $0.23$, for a narrating persona and
    for a human or machine component that announces a goal held elsewhere.
  evidence:
    file: simulation/output/results.json
    run_id: agentoscope
    pointer: /realization_map/legibility/persona
    reported: '0.23'
    decimals: 2
    units: legibility term L of the persona (normalized)
    conditions: deterministic 13x13 gridworld, seed 0, 40 instances, beta 1.5, horizon 40; oracle scorer
- id: abs-unique
  kind: computation
  passage: In a blind test with five planted mechanisms, the evaluator never excludes the truth and isolates
    it uniquely in $0.73$ of readings against a chance of $0.2$, of which the sham contributes $0.22$.
  evidence:
    file: simulation/output/results.json
    run_id: agentoscope
    pointer: /blind_recovery/with_sham/overall_unique
    reported: '0.73'
    decimals: 2
    units: fraction of readings isolating the truth uniquely
    conditions: blind recovery over 24 instances, five planted organisms, tolerance 2 nats, alternate-goal
      class priced at log 169 nats
