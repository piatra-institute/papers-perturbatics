abstract: 'Observing a natural, artificial or hybrid system at rest does not reveal whether it pursues
  a goal, whether it is competent, or which component authored its output, because perfect regulation
  and undisturbed rest leave the same flat record. We call the study of this situation perturbatics. Its
  separation principle states that when two organizational models agree over the regime a system has occupied,
  no analysis of that record distinguishes them; separation requires a probe under which the rivals predict
  differently. Agency is scored as a Bayes factor against a passive rival. In a gridworld, three systems
  trace one path at rest (every pairwise AUROC $0.50$), and a two-probe battery separates every pair although
  neither probe does alone. A system tracking the last-announced target is invisible to that battery until
  a matched sham, a decoy where the goal did not move, separates it at $1.0$. No finite battery certifies
  a capacity against an unrestricted class of rivals: a mimic that has memorized the declared battery
  is separated only by an unseen draw. Do-Shapley attribution of both the evidence for agency and the
  realized performance yields a legibility term, their difference, which takes the same value, $0.23$,
  for a narrating persona and for a human or machine component that announces a goal held elsewhere. In
  a blind test with five planted mechanisms, the evaluator never excludes the truth and isolates it uniquely
  in $0.73$ of readings against a chance of $0.2$, of which the sham contributes $0.22$. For consciousness
  the deciding probe is uninformative, inadmissible and underdetermined in description, and no number
  results.'
web_blurb: Agency is invisible in a system at rest and measurable only under probes that make rival organizational
  models predict differently. A gridworld demonstrator attributes evidence and capacity across components
  and recovers planted mechanisms blind.
