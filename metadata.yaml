abstract: |-
  At rest, a system reveals nothing of its own agency. Whether an agent pursues a goal, whether it is competent, who authored its output, none of that is on its surface, and the agent may be natural, artificial, simulated, or hybrid. The artificial case makes the difficulty vivid: the surface answers as though a single mind stood behind it while what stands there is a composite, a model under a persona, with a memory, a harness, and tools. A system that holds its state and a system that merely rests present the same face, because a flat record is what perfect regulation looks like. We call the study of this situation perturbatics, and its principle is a separation principle: when two organizational models agree over the regime a system has been in, no analysis of that record tells them apart, and separation requires a probe, a controlled difference that makes the rivals predict differently. An instrument follows. Agency is scored as a Bayes factor between a goal model and a passive rival; a gridworld holds systems that trace one path at rest, at an area under the ROC of 0.50 that is the identity of their paths rather than a failed classifier, and the battery separates every pair though no single probe in it does. It separates only the pairs it was built for: a system tracking the last-announced target is invisible to the whole declared battery until a matched sham, a decoy where the goal did not go, separates it at 1.0. No finite battery certifies a capacity against an unrestricted class of rivals, so every probe owes negative controls to the rivals it leaves fused, and an enumerated battery whose instances are published is spent by a system that can learn them: a probe-aware mimic that has memorized the declared battery, sham included, defeats all of it and is separated by a draw it has never seen. The evidence is attributed across the assemblage twice, over the evidence for agency and over the realized performance, and the difference of the two maps is a legibility term, the gap between what a component shows and what it does. By construction the gap reads a role rather than a substrate, returning the same number for a narrating persona and for whichever of a human operator or a machine register merely announces a goal the other holds. One reading is made blind: five mechanisms are planted and hidden, and the evaluator returns an identified set rather than a verdict, never refuting the truth, isolating it alone in 0.73 of readings against a chance of 0.2, with the sham worth 0.22 of that and the residual entanglements sitting where the principle predicts. The account ends where its probe cannot be run. For consciousness the deciding act is uninformative, inadmissible, and underdetermined in its description, three silences of three kinds, and what remains is not a number but a stance, the refusal to treat a thing that might be someone as a thing.
