abstract: |-
  An agent is not what it appears to be, and what it appears to be is not what it is: it presents as a single character with a goal and is an assemblage of a model, a persona, a memory, a harness, permissions, and tools, whose apparent unity is an interface effect. This paper is about how to read such a thing, given that the properties worth reading, agency, competence, authorship, are not on the surface. A system that holds its state and a system that defends it present the same face at rest, because a controller that perfectly regulates a variable and a variable simply undisturbed produce identical records; the difference is a fact about what each would do under disturbance, and if nothing disturbs them the difference is not in the data at all. We call the study of this situation perturbatics, and its principle is a separation principle: when two organizational models agree over the regime a system has been in, no analysis of that record tells them apart, and separation requires a probe, a controlled difference that makes the models predict differently, from a deliberate intervention or a natural experiment. A minimal instrument follows. Agency is scored as a Bayes factor between a goal model and a passive model; a gridworld holds three systems that trace the same path and so score at chance when watched (area under the ROC 0.50), and are separated by the probe battery though by no single probe in it: moving the goal exposes the route script (1.0) while leaving the two goal-trackers identical, blocking the path exposes the planner (0.78), and the pooled separation of planner from script is 0.95. The instrument attributes that evidence across the assemblage by the do-Shapley value of each component, and separates two maps, one over the evidence for agency and one over the realized capacity of goal attainment and rerouting. Their difference is a legibility term, and it makes agency theater a number: a narrating persona, whose cheap-talk channel is a dial set at 0.3 of the movement evidence, accounts for 0.23 of the evidence for agency by that construction while realizing none of it, where the goal register realizes what it shows. The reading climbs from just below zero to full as the declared boundary widens from the planner alone to the unit that encloses its goal and world model, and richness is a false friend throughout, a chaotic walker scoring the highest trajectory complexity and the lowest agency. The account has a boundary of its own, and it is the important part. For agency you can move the goal a hundred times and read the score. Consciousness is different: turning the system off, the one candidate probe, returns no outcome the rival hypotheses score differently, cannot be undone with any certainty of restoring the same individual, and presupposes a theory of that individual the instrument already failed to supply, so the science must also say when not to perturb, and that some questions no admissible probe reaches. There the instrument stops, and what is left is not a number but a relation, and the grief, or its absence, of whoever turned the machine down.
