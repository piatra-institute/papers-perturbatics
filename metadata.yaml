abstract: |-
  At rest a system reveals nothing of its own agency. Whether an artificial agent pursues a goal, whether it is competent, who authored its output, none of that is on its surface, and the surface answers as though a single mind stood behind it while what stands there is a composite, a model under a persona, with a memory, a harness, and tools. A perfectly regulated variable and a merely undisturbed one leave the same flat record, because a flat record is what perfect regulation means. We call the study of this situation perturbatics, and its principle is a separation principle: when two organizational models agree over the regime a system has been in, no analysis of that record tells them apart, and separation requires a probe, a controlled difference that makes the rivals predict differently. An instrument follows. Agency is scored as a Bayes factor between a goal model and a passive rival; a gridworld holds systems that trace one path at rest, at an area under the ROC of 0.50 that is the identity of their paths rather than a failed classifier, and the battery separates every pair at 0.95 where no probe in it does alone. It separates the pairs it was built for and no others: a system that tracks the last-announced target is invisible to the whole declared battery, and a matched sham, a decoy announced where the goal did not go, separates it at 1.0. No finite battery certifies a capacity against an unrestricted class of rivals, so every probe owes a sham to the one beside it. One reading is made blind, and it is the only one here that could have come out wrong: five mechanisms are planted and hidden, and the battery recovers which is in play in 0.916667 of episodes against a chance level of 0.2, failing on one pair for a reason the principle predicts, with the sham worth 0.2 of that recovery. The evidence is then attributed across the assemblage twice, over the evidence for agency and over the realized capacity, and the difference of the two maps is a legibility term that makes agency theater a number. It reads a role rather than a substrate: goal authority handed to a human operator and then to a machine register returns mirror-image maps, so a human who authorizes what a machine decides carries the number a narrating persona carries. The account names its own boundary, and it is the important part. For agency the discriminating probe is cheap and repeatable. For consciousness it returns no reading the rival hypotheses score apart, must not be run to find out, and for a copyable individual cannot be stated, so the science must also say when not to perturb. There the instrument stops. What is left is a relation, and the grief, or its absence, of whoever turned the machine down.
