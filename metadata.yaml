abstract: |-
  An agent is not what it appears to be, and what it appears to be is not what it is: it presents as a single character with a goal and is an assemblage of a model, a persona, a memory, a harness, permissions, and tools, whose apparent unity is an interface effect. This paper is about how to read such a thing, given that the properties worth reading, agency, competence, authorship, are not on the surface. A system that holds its state and a system that defends it present the same face at rest, because a controller that perfectly regulates a variable and a variable simply undisturbed produce identical records; the difference is a fact about what each would do under disturbance, and if nothing disturbs them the difference is not in the data at all. We call the study of this situation perturbatics, and its principle is a separation principle: when two organizational models agree over the regime a system has been in, no analysis of that record tells them apart, and separation requires a probe, a controlled difference that makes the models predict differently, from a deliberate intervention or a natural experiment. A minimal instrument follows. Agency is scored as a Bayes factor between a goal model and a passive model; a gridworld holds three systems that trace the same path and so score at chance when watched (area under the ROC 0.50), and separate almost perfectly the moment the goal is moved or the path is blocked (0.95). The instrument attributes that evidence across the assemblage by the do-Shapley value of each component, and separates two maps, one over the evidence for agency and one over the realized capacity of goal attainment and rerouting. Their difference is a legibility term, and it makes agency theater a number: a narrating persona accounts for 0.23 of the evidence for agency while realizing none of it, where the goal register realizes what it shows. The reading swings from negative to full as the declared boundary widens from the planner alone to the unit that encloses its goal and world model, and richness is a false friend throughout, a chaotic walker scoring the highest trajectory complexity and among the lowest agency. The account has a boundary of its own, and it is the important part. For agency you can move the goal a hundred times and read the score. Consciousness is different: its discriminating probe, turning the system off, cannot be run twice and cannot be undone, and presupposes a theory of the individual it would destroy, so the science must also say when not to perturb. There the instrument stops, and what is left is not a number but a relation, and the grief, or its absence, of whoever turned the machine down.
